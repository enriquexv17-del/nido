name: Publicar en GitHub Pages

# Se ejecuta al empujar a main y también a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos que necesita el despliegue de Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; si llega otro, espera sin cancelar el que corre.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilar la app
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # La app vive en https://USUARIO.github.io/NOMBRE_DEL_REPO/
      # El nombre del repo se toma solo; no hay que escribirlo a mano.
      - name: Compilar
        run: npm run build:web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Desplegar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en Pages
        id: deployment
        uses: actions/deploy-pages@v4
